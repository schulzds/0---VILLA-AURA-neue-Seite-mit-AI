      <img src="assets/img/logo-mark.png" alt="Villa Aura logo">

    <!-- Navigation -->
    <nav class="nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="villa.html">Villa Aura</a>
      <a href="gallery.html" class="is-active">Gallery</a>
      <a href="location.html">Location</a>
      <a href="beach.html">Our Beach</a>
      <a href="reviews.html">Reviews</a>
      <a href="hosts.html">Your Hosts</a>

      <a class="btn btn--small"
         href="https://www.blendinblue.com/villa-aura"
         target="_blank"
         rel="noopener">
        Book now
      </a>
    </nav>

    <!-- Burger -->
    <button class="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile" id="mobileMenu" hidden>
    <div class="container mobile__inner">
      <a href="index.html">Home</a>
      <a href="villa.html">Villa Aura</a>
      <a href="gallery.html">Gallery</a>

</header>

<!-- CONTENT -->
<main>
  <section class="section">
    <div class="container">
      <p class="kicker">Gallery</p>
 

      <!-- JS rendert hier die Bilder -->
      <div class="gallery" id="galleryGrid"></div>
    </div>
  </section>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container footer__grid">
    <div>
      <strong>Villa Aura Naxos</strong>
      <p class="small">Boutique Luxury Seaside Living</p>
      <p class="small">© <span id="year"></span> Villa Aura Naxos</p>
    </div>

    <div class="footer__links">
      <a href="imprint.html">Imprint</a>
      <a href="privacy.html">Privacy</a>
    </div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

<!-- Burger + ggf. globales JS -->
<script src="script.js"></script>

<!-- Gallery Loader -->
<script>
  (function () {
    const galleryGrid = document.getElementById('galleryGrid');
    if (!galleryGrid) return;

    const TOTAL_IMAGES = 41; // <- hier erhöhen, wenn mehr Bilder da sind

    for (let i = 1; i <= TOTAL_IMAGES; i++) {
      const num = String(i).padStart(2, '0');
      const src = `assets/img/gallery-${num}.jpg`;

      const item = document.createElement('div');
      item.className = 'gitem';

      const img = document.createElement('img');
      img.src = src;
      img.alt = `Villa Aura photo ${i}`;
      img.loading = 'lazy';

      item.appendChild(img);
      galleryGrid.appendChild(item);
    }
  })();
</script>

</body>
</html>
