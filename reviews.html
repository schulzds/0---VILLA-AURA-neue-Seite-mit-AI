<!-- Reviews Loader + Lightbox (eingebaut, sauber, nicht abgeschnitten) -->
<script>
  (function () {
    const grid = document.getElementById('reviewsGrid');
    if (!grid) return;

    const TOTAL_REVIEWS = 26;

    for (let i = 1; i <= TOTAL_REVIEWS; i++) {
      const src = `assets/img/review${i}.jpg`;

      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'reviewcard';
      card.setAttribute('aria-label', `Open review ${i}`);

      const img = document.createElement('img');
      img.src = src;
      img.alt = `Guest review ${i} – Villa Aura`;
      img.loading = 'lazy';

      card.appendChild(img);
      grid.appendChild(card);
    }

    // Overlay
    const overlay = document.createElement('div');
    overlay.className = 'rlx';
    overlay.innerHTML = `
      <button class="rlx__close" type="button" aria-label="Close">×</button>
      <div class="rlx__inner" role="dialog" aria-modal="true">
        <img class="rlx__img" alt="">
      </div>
    `;
    document.body.appendChild(overlay);

    const bigImg = overlay.querySelector('.rlx__img');
    const closeBtn = overlay.querySelector('.rlx__close');

    function openLightbox(src, alt) {
      bigImg.src = src;
      bigImg.alt = alt || '';
      overlay.classList.add('is-open');
      document.documentElement.style.overflow = 'hidden';
    }

    function closeLightbox() {
      overlay.classList.remove('is-open');
      document.documentElement.style.overflow = '';
      setTimeout(() => { bigImg.src = ''; }, 200);
    }

    // Click on card -> open
    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.reviewcard');
      if (!card) return;
      const img = card.querySelector('img');
      if (!img) return;
      openLightbox(img.src, img.alt);
    });

    // Click outside / X closes
    overlay.addEventListener('click', (e) => {
      const inner = e.target.closest('.rlx__inner');
      if (!inner) closeLightbox();
    });
    closeBtn.addEventListener('click', closeLightbox);

    // ESC closes
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeLightbox();
    });
  })();
</script>

</body>
